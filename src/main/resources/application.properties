spring.application.name=vetturno

# Configuracion local opcional(no se sube a Git), se copia application-local.properties.example
# como application-local.properties y se ponen los datos propios.
spring.config.import=optional:classpath:application-local.properties

# Conexion a MySQL, se toma de variables de entorno o de application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vetturno}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate durante el desarrollo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT, la clave se lee de la variable JWT_SECRET o de application-local.properties(minimo 32
# caracteres) y nunca se escribe una clave real en este archivo.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Swagger UI con las secciones y operaciones siempre en el mismo orden
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
